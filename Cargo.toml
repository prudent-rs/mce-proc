[package]
name = "mce-proc"
version = "0.0.1"

edition = "2024"
# Rust 1.88.0+ is required by mce-lib.
rust-version = "1.88.0"

license = "BSD-2-Clause OR Apache-2.0 OR MIT"

authors = ["Peter Lyons Kehl<peter.kehl@gmail.com>"]
description = "Markdown Code Extractor procedural macros (part of mce): Collect code blocks from your README.md (or another Markdown file). Optional filtering. Add optional prefix and suffix to each code block, as well as the overall output. Example: use with no-panic"

categories = ["development-tools", "development-tools::testing", "rust-patterns"]

keywords = ["extract", "readme", "macro", "macros", "panic"]

repository = "https://github.com/prudent-rs/mce-proc"
homepage = "https://github.com/prudent-rs/mce"

[lib]
proc-macro = true

[lints.rust]
unexpected_cfgs = { level = "forbid"}
unknown_lints = { level = "forbid"}

[dependencies]
proc-macro-rules = "0.4.0"
proc-macro2 = {version="1.0.60", features=["span-locations"] }
proc-macro2-diagnostics-more = { version = "0.0.1", path = "../proc-macro2-diagnostics-more", features = ["alloc", "proc-macro2-diagnostics"]}

# EXACT VERSION with = prefix
mce-lib = {version="= 0.0.1", path="../mce-lib", features=["std"]}

quote = "1.0.26"
serde = { version = "1.0", features = ["derive"] }
syn = "2.0.15"
proc-macro2-diagnostics = "0.10.1"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
